# GHOST TRACK // APSIS · V17 headless regression
#
# Two GitHub Actions checks with DIFFERENT, explicitly named semantics
# (Issue #14 + PR #15 review correction: do not hide legacy failures, do not fake
# a green full matrix, and do not pass when a declared baseline entry was never
# executed / never selected / was blocked):
#
#   1) "Phase 0 gate (Phase 0 acceptance)" — runs ONLY the Phase 0 required cases
#      (profile matrix probe, real-entry E2E, and the 4 build-profile boot smokes;
#      definition lives in game_v17/tests/probe_matrix.json -> gates.phase0).
#      This check must be green for Phase 0 acceptance.
#      NOTE: the job name does NOT prove branch protection. Branch protection /
#      required-check configuration could not be verified from this repository
#      (private repo, protection API returns HTTP 403); only the job result itself
#      is evidence. See PR body.
#
#   2) "Full matrix (baseline-aware; known legacy FAILs shown, red only on new
#      regressions)" — runs ALL cases declared in probe_matrix.json (Phase A1.1 adds the entity-metadata authority probe) with
#      `-Baseline game_v17/tests/known_baseline_failures.json`.
#      The 8 known pre-existing failures are STILL EXECUTED, STILL REPORTED AS
#      FAIL (never renamed PASS, never skipped, no continue-on-error).
#      STRICT / FAIL-CLOSED: the check turns red when (a) a NEW failure appears,
#      (b) an existing legacy failure's PASS/FAIL count drifts or it starts to
#      pass, (c) a case times out or is unexpectedly NOT RUN, or (d) any declared
#      baseline entry is NOT EXECUTED (blocked/NOT RUN), MISSING from the run, or
#      NOT SELECTED by filters. A baseline "pass" is only reported when every
#      baseline entry ran as FAIL with matching counts (complete=true).
#
#   3) Both checks upload the REAL test artifacts. `.test-results/` is a hidden
#      dot-directory, so `actions/upload-artifact@v4` needs
#      `include-hidden-files: true` (Issue #14 root cause of "No files found").
#      ARTIFACT FAIL-CLOSED: before upload each job asserts that the latest run
#      directory contains summary.json + report.md + per-case logs matching the
#      run id; upload-artifact uses `if-no-files-found: error`. Missing evidence
#      makes the check fail instead of silently producing no artifact.
#
#   4) The full-matrix job also runs `game_v17/tests/baseline_gate_selftest.ps1`
#      (if: always(), no continue-on-error): a repeatable regression proving that
#      a blocked/NOT RUN baseline entry and a filtered-out baseline entry make the
#      strict baseline check exit non-zero, while an explicitly labelled partial
#      local run (`-AllowPartialBaseline`) never claims a complete baseline pass.
#
# Toolchain is pinned: Godot 4.7.2-stable win64 zip verified against the
# official SHA-256, cached by version+checksum, same OS/binary as local dev.
# No secrets, no game content upload; artifacts contain only .test-results/.
#
# History:
#   - run 39778490176: single job, artifact upload produced 0 files (hidden dir).
#   - run 39786721057 / 39787908114: two jobs + include-hidden-files: true,
#     artifacts verified (Issue #14 closeout).
#   - this revision: strict fail-closed baseline coverage + artifact assertions +
#     baseline gate self-test (PR #15 review correction).
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_ZIP: Godot_v4.7.2-stable_win64.exe.zip
  # Official SHA-256 of the release asset (GitHub Releases API "digest" field for
  # godotengine/godot-builds tag 4.7.2-stable). The download fails closed if the
  # archive does not match, so the toolchain is pinned to an exact artifact.
  GODOT_ZIP_SHA256: 731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953
  GODOT_ZIP_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip
  GODOT_DIR: tools/godot
  GODOT_CONSOLE: tools/godot/Godot_v4.7.2-stable_win64_console.exe

jobs:
  # ── Phase 0 acceptance gate ───────────────────────────────────────────────
  phase0-gate:
    name: Phase 0 gate (Phase 0 acceptance) — profile / boot smokes / real-entry E2E
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache pinned Godot 4.7.2 download
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_ZIP_SHA256 }}

      - name: Download + verify + extract Godot 4.7.2 (cache miss only)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zipPath = Join-Path $env:RUNNER_TEMP $env:GODOT_ZIP
          Write-Host "Downloading $env:GODOT_ZIP_URL"
          Invoke-WebRequest -Uri $env:GODOT_ZIP_URL -OutFile $zipPath -UseBasicParsing

          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          $expected = $env:GODOT_ZIP_SHA256.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Godot archive SHA-256 mismatch: expected $expected, got $actual"
          }
          Write-Host "SHA-256 verified: $actual"

          New-Item -ItemType Directory -Path $env:GODOT_DIR -Force | Out-Null
          Expand-Archive -LiteralPath $zipPath -DestinationPath $env:GODOT_DIR -Force
          Get-ChildItem -LiteralPath $env:GODOT_DIR | Select-Object Name, Length

      - name: Verify Godot version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:GODOT_CONSOLE)) {
            throw "Expected Godot console executable not found: $env:GODOT_CONSOLE"
          }
          $version = & $env:GODOT_CONSOLE --version 2>&1 | Out-String
          Write-Host "Godot version: $version"
          if ($version -notmatch [regex]::Escape('4.7.2')) {
            throw "Expected Godot 4.7.2, got: $version"
          }

      - name: Run Phase 0 required gate (-Gate phase0)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File ./run_tests.ps1 -Ci -Gate phase0 -GodotBin $env:GODOT_CONSOLE
          $code = $LASTEXITCODE
          Write-Host "PHASE0_GATE_EXIT=$code"
          exit $code

      # Fail-closed evidence: a green test step with missing artifacts is NOT valid
      # evidence. Assert the real files exist and match the run dir before uploading.
      - name: Assert test artifacts exist before upload
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dirs = @(Get-ChildItem -Path '.test-results' -Directory -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending)
          if ($dirs.Count -eq 0) {
            throw 'ARTIFACT ASSERT FAILED: no .test-results run directory was produced'
          }
          $runDir = $dirs[0]
          foreach ($name in @('summary.json', 'report.md')) {
            $p = Join-Path $runDir.FullName $name
            if (-not (Test-Path -LiteralPath $p -PathType Leaf)) {
              throw "ARTIFACT ASSERT FAILED: missing required file $p"
            }
            if ((Get-Item -LiteralPath $p).Length -le 0) {
              throw "ARTIFACT ASSERT FAILED: empty required file $p"
            }
          }
          $logDir = Join-Path $runDir.FullName 'logs'
          $logs = @(Get-ChildItem -LiteralPath $logDir -File -ErrorAction SilentlyContinue)
          if ($logs.Count -eq 0) {
            throw "ARTIFACT ASSERT FAILED: no per-case logs under $logDir"
          }
          $s = Get-Content -LiteralPath (Join-Path $runDir.FullName 'summary.json') -Raw | ConvertFrom-Json
          if ([string]$s.run_id -ne [string]$runDir.Name) {
            throw "ARTIFACT ASSERT FAILED: summary.run_id '$($s.run_id)' != run dir '$($runDir.Name)'"
          }
          $caseCount = @($s.cases).Count
          if ($caseCount -le 0) {
            throw 'ARTIFACT ASSERT FAILED: summary.json contains no cases'
          }
          Write-Host "ARTIFACT ASSERT OK run_dir=$($runDir.Name) cases=$caseCount logs=$($logs.Count)"

      - name: Job summary — Phase 0 gate
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = @(
            '## Phase 0 acceptance gate',
            '',
            'Cases: profile matrix probe + real-entry E2E + 4 boot smokes (`-Gate phase0`).',
            'This check must be green for Phase 0 acceptance; it does NOT include the full historical matrix.',
            'Job name/result is not proof of branch protection: required-check configuration could not be read from this repository (HTTP 403).',
            ''
          )
          $runDir = Get-ChildItem -Path '.test-results' -Directory -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $runDir) {
            $lines += '**No `.test-results` output directory was produced by the runner.**'
          } else {
            $summaryPath = Join-Path $runDir.FullName 'summary.json'
            $lines += "Run directory: ``$($runDir.Name)``"
            if (Test-Path -LiteralPath $summaryPath) {
              $s = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json
              $lines += ''
              $lines += '| total | pass | fail | timeout | not run | exit code |'
              $lines += '| --- | --- | --- | --- | --- | --- |'
              $lines += "| $($s.totals.total) | $($s.totals.pass) | $($s.totals.fail) | $($s.totals.timeout) | $($s.totals.not_run) | $($s.exit_code) |"
              $lines += ''
              $lines += '| case | status | exit | pass/fail |'
              $lines += '| --- | --- | --- | --- |'
              foreach ($c in @($s.cases)) {
                $pf = if ($null -ne $c.pass_count) { "$($c.pass_count)/$($c.fail_count)" } else { '-' }
                $lines += "| ``$($c.id)`` | $($c.status) | $($c.exit_code) | $pf |"
              }
            } else {
              $lines += '**summary.json missing — investigate the runner output.**'
            }
          }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload Phase 0 gate test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-gate-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # ── Phase A-01 authority regression gate (A0-T1/T2/T3) ───────────────────
  # Independent of gates.phase0. These probes are EXPECTED TO FAIL on the current
  # baseline: they encode the authority-chain defects Phase A0 located (Issues #2/#4).
  # This job is therefore RED BY DESIGN until the underlying fixes land. It must never
  # be made green with continue-on-error / skipped cases / relaxed assertions; the
  # declared expected-failure baseline (phasea_baseline_failures.json) is what makes
  # the numbers auditable. Gate phase0 is a separate job and is unaffected.
  phasea-gate:
    name: Phase A gate (A0-T1/T2/T3 authority probes; RED BY DESIGN on the current baseline)
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache pinned Godot 4.7.2 download
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_ZIP_SHA256 }}

      - name: Download + verify + extract Godot 4.7.2 (cache miss only)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zipPath = Join-Path $env:RUNNER_TEMP $env:GODOT_ZIP
          Write-Host "Downloading $env:GODOT_ZIP_URL"
          Invoke-WebRequest -Uri $env:GODOT_ZIP_URL -OutFile $zipPath -UseBasicParsing

          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          $expected = $env:GODOT_ZIP_SHA256.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Godot archive SHA-256 mismatch: expected $expected, got $actual"
          }
          Write-Host "SHA-256 verified: $actual"

          New-Item -ItemType Directory -Path $env:GODOT_DIR -Force | Out-Null
          Expand-Archive -LiteralPath $zipPath -DestinationPath $env:GODOT_DIR -Force
          Get-ChildItem -LiteralPath $env:GODOT_DIR | Select-Object Name, Length

      - name: Verify Godot version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:GODOT_CONSOLE)) {
            throw "Expected Godot console executable not found: $env:GODOT_CONSOLE"
          }
          $version = & $env:GODOT_CONSOLE --version 2>&1 | Out-String
          Write-Host "Godot version: $version"
          if ($version -notmatch [regex]::Escape('4.7.2')) {
            throw "Expected Godot 4.7.2, got: $version"
          }

      # The three probes are expected to FAIL against the declared Phase A baseline.
      # A-00 协调后语义：这个独立 job 的**红绿由 probe 的真实退出码决定**，不再硬编码
      # 「三个必须 FAIL」。理由：Phase A 切片会逐卡转绿（A0-T1 已在 P20 后被整合候选修复），
      # 写死 expected FAIL 会让真实修复被判成「计数漂移」，也会掩盖真正的 NOT RUN。
      # 判据：
      #   * 每个声明的 Phase A case 都必须真的执行（出现且 status ∈ {PASS, FAIL}）；
      #     0 case / NOT RUN / TIMEOUT 一律失败，不算通过。
      #   * summary 的 totals 与逐 case 计数必须自洽（pass+fail == 实际，且与 runner 汇总一致）。
      #   * job 退出码 = runner 的真实退出码：全绿则 job 绿，仍有真实 FAIL 则 job 红。
      #   * 总是上传实际报告（后续 step 用 if: always()）。
      # 完整 baseline job 仍严格核对既有失败条目（不在此 job）。
      - name: Run Phase A authority gate (-Gate phaseA)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File ./run_tests.ps1 -Ci -Gate phaseA -GodotBin $env:GODOT_CONSOLE
          $code = $LASTEXITCODE
          Write-Host "PHASEA_GATE_EXIT=$code"

          $dirs = @(Get-ChildItem -Path '.test-results' -Directory -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending)
          if ($dirs.Count -eq 0) { throw 'PHASE A ASSERT FAILED: no .test-results run directory' }
          $summaryPath = Join-Path $dirs[0].FullName 'summary.json'
          if (-not (Test-Path -LiteralPath $summaryPath)) {
            throw "PHASE A ASSERT FAILED: missing $summaryPath"
          }
          $s = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json

          $problems = New-Object System.Collections.ArrayList
          $required = @(
            'integration.a0_track_truth_authority',
            'integration.a0_entity_metadata_pipeline',
            'integration.a0_save_roundtrip_authority'
          )
          $passCount = 0
          $failCount = 0
          foreach ($cid in $required) {
            $c = @($s.cases | Where-Object { [string]$_.id -eq $cid })
            if ($c.Count -ne 1) { [void]$problems.Add("$cid was NOT RUN (missing from summary)"); continue }
            $c = $c[0]
            $st = [string]$c.status
            $pf = [int]$c.pass_count
            $ff = [int]$c.fail_count
            Write-Host ("PHASE A CASE {0}: status={1} exit={2} pass={3} fail={4}" -f $cid, $st, $c.exit_code, $pf, $ff)
            if ($st -eq 'PASS') {
              if ($ff -ne 0) { [void]$problems.Add("$cid status=PASS but fail_count=$ff") }
              $passCount++
            }
            elseif ($st -eq 'FAIL') {
              if ($ff -le 0) { [void]$problems.Add("$cid status=FAIL but fail_count=$ff") }
              if ([int]$c.exit_code -eq 0) { [void]$problems.Add("$cid status=FAIL but exit_code=0") }
              $failCount++
            }
            else {
              [void]$problems.Add("$cid not executed: status=$st (NOT RUN / TIMEOUT never counts as pass)")
            }
          }
          $declared = @($s.cases).Count
          if ($declared -ne $required.Count) {
            [void]$problems.Add("summary has $declared cases, gate declares $($required.Count)")
          }
          if ([int]$s.totals.pass -ne $passCount) {
            [void]$problems.Add("totals.pass=$($s.totals.pass) != counted $passCount")
          }
          if ([int]$s.totals.fail -ne $failCount) {
            [void]$problems.Add("totals.fail=$($s.totals.fail) != counted $failCount")
          }
          if ($problems.Count -gt 0) {
            $problems | ForEach-Object { Write-Host "PHASE A PROBLEM: $_" }
            throw "PHASE A GATE ASSERT FAILED ($($problems.Count) problem(s)) - a probe was skipped, not run, or reported inconsistent counts"
          }
          if ($failCount -eq 0) {
            Write-Host 'PHASE A ASSERT OK: all 3 authority probes executed and PASSED.'
          }
          else {
            Write-Host ("PHASE A ASSERT OK: all 3 authority probes executed; {0} still FAIL on real, unfixed defects (see per-case logs)." -f $failCount)
          }
          exit $code

      - name: Assert test artifacts exist before upload
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dirs = @(Get-ChildItem -Path '.test-results' -Directory -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending)
          if ($dirs.Count -eq 0) {
            throw 'ARTIFACT ASSERT FAILED: no .test-results run directory was produced'
          }
          $runDir = $dirs[0]
          foreach ($name in @('summary.json', 'report.md')) {
            $p = Join-Path $runDir.FullName $name
            if (-not (Test-Path -LiteralPath $p -PathType Leaf)) {
              throw "ARTIFACT ASSERT FAILED: missing required file $p"
            }
            if ((Get-Item -LiteralPath $p).Length -le 0) {
              throw "ARTIFACT ASSERT FAILED: empty required file $p"
            }
          }
          $logDir = Join-Path $runDir.FullName 'logs'
          $logs = @(Get-ChildItem -LiteralPath $logDir -File -ErrorAction SilentlyContinue)
          if ($logs.Count -eq 0) {
            throw "ARTIFACT ASSERT FAILED: no per-case logs under $logDir"
          }
          Write-Host "ARTIFACT ASSERT OK run_dir=$($runDir.Name) logs=$($logs.Count)"

      - name: Job summary — Phase A gate
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = @(
            '## Phase A-01 authority regression gate (A0-T1/T2/T3)',
            '',
            'Cases: `-Gate phaseA` (track truth authority, entity metadata pipeline, save roundtrip authority).',
            '',
            '**This job is RED BY DESIGN on the current baseline.** The three probes encode the authority-chain defects',
            'that Phase A0 located (Issues #2/#4). They are declared in `game_v17/tests/phasea_baseline_failures.json` as',
            'expected FAIL with exact counts; the CI step asserts that expected-failure SHAPE (not a green run).',
            'Making this job green requires fixing the runtime authority chain — never skipping, hiding or relaxing the probes.',
            '`gates.phase0` is a separate job and is unaffected by this gate.',
            ''
          )
          $runDir = Get-ChildItem -Path '.test-results' -Directory -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $runDir) {
            $lines += '**No `.test-results` output directory was produced by the runner.**'
          } else {
            $summaryPath = Join-Path $runDir.FullName 'summary.json'
            $lines += "Run directory: ``$($runDir.Name)``"
            if (Test-Path -LiteralPath $summaryPath) {
              $s = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json
              $lines += ''
              $lines += '| total | pass | fail | timeout | not run | exit code |'
              $lines += '| --- | --- | --- | --- | --- | --- |'
              $lines += "| $($s.totals.total) | $($s.totals.pass) | $($s.totals.fail) | $($s.totals.timeout) | $($s.totals.not_run) | $($s.exit_code) |"
              if ($null -ne $s.phase_a_baseline) {
                $pa = $s.phase_a_baseline
                $lines += ''
                $lines += "Phase A expected-failure baseline: known=$($pa.known_fail) new=$($pa.new_fail) drift=$($pa.baseline_drift) unverified=$($pa.baseline_unverified) unselected=$($pa.baseline_unselected) complete=$($pa.complete)"
              }
              $lines += ''
              $lines += '| case | status | exit | pass/fail | declared expected FAIL |'
              $lines += '| --- | --- | --- | --- | --- |'
              foreach ($c in @($s.cases)) {
                $pf = if ($null -ne $c.pass_count) { "$($c.pass_count)/$($c.fail_count)" } else { '-' }
                $exp = if ($null -ne $c.baseline) { "exit=$($c.baseline.expected)" } else { '-' }
                $lines += "| ``$($c.id)`` | $($c.status) | $($c.exit_code) | $pf | $exp |"
              }
            } else {
              $lines += '**summary.json missing — investigate the runner output.**'
            }
          }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload Phase A gate test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phasea-gate-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # ── Full historical matrix, baseline-aware (legacy failures stay visible) ──
  full-matrix:
    name: Full matrix (baseline-aware; known legacy FAILs shown, red only on new regressions)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache pinned Godot 4.7.2 download
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_ZIP_SHA256 }}

      - name: Download + verify + extract Godot 4.7.2 (cache miss only)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zipPath = Join-Path $env:RUNNER_TEMP $env:GODOT_ZIP
          Write-Host "Downloading $env:GODOT_ZIP_URL"
          Invoke-WebRequest -Uri $env:GODOT_ZIP_URL -OutFile $zipPath -UseBasicParsing

          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          $expected = $env:GODOT_ZIP_SHA256.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Godot archive SHA-256 mismatch: expected $expected, got $actual"
          }
          Write-Host "SHA-256 verified: $actual"

          New-Item -ItemType Directory -Path $env:GODOT_DIR -Force | Out-Null
          Expand-Archive -LiteralPath $zipPath -DestinationPath $env:GODOT_DIR -Force
          Get-ChildItem -LiteralPath $env:GODOT_DIR | Select-Object Name, Length

      - name: Verify Godot version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:GODOT_CONSOLE)) {
            throw "Expected Godot console executable not found: $env:GODOT_CONSOLE"
          }
          $version = & $env:GODOT_CONSOLE --version 2>&1 | Out-String
          Write-Host "Godot version: $version"
          if ($version -notmatch [regex]::Escape('4.7.2')) {
            throw "Expected Godot 4.7.2, got: $version"
          }

      - name: Run FULL regression matrix (baseline-aware)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # All matrix cases are executed. Known pre-existing failures stay FAIL in the
          # output/report. Strict fail-closed semantics: exit 0 only when every
          # declared baseline entry ran as expected FAIL with matching counts, and
          # there is no NEW failure, drift, timeout, unexpected NOT RUN, unverified
          # baseline entry or unselected baseline entry.
          # Phase A-01: a SECOND, independent expected-failure baseline is passed via
          # -BaselineExtra so the Phase A authority probes are classified separately
          # from the Phase 0 legacy baseline. Their statuses still stay FAIL.
          pwsh -NoProfile -File ./run_tests.ps1 -Ci -Baseline game_v17/tests/known_baseline_failures.json -BaselineExtra game_v17/tests/phasea_baseline_failures.json -GodotBin $env:GODOT_CONSOLE
          $code = $LASTEXITCODE
          Write-Host "FULL_MATRIX_EXIT=$code"
          exit $code

      # Repeatable regression: proves fail-closed behavior for blocked/NOT RUN and
      # filtered-out baseline entries. Runs even if the matrix step above failed.
      - name: Regression — baseline gate fail-closed self-test
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File ./game_v17/tests/baseline_gate_selftest.ps1 -NoImport -GodotBin $env:GODOT_CONSOLE
          $code = $LASTEXITCODE
          Write-Host "BASELINE_GATE_SELFTEST_EXIT=$code"
          exit $code

      # Fail-closed evidence: no artifact upload without a real run dir + files.
      - name: Assert test artifacts exist before upload
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dirs = @(Get-ChildItem -Path '.test-results' -Directory -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending)
          if ($dirs.Count -eq 0) {
            throw 'ARTIFACT ASSERT FAILED: no .test-results run directory was produced'
          }
          $runDir = $dirs[0]
          foreach ($name in @('summary.json', 'report.md')) {
            $p = Join-Path $runDir.FullName $name
            if (-not (Test-Path -LiteralPath $p -PathType Leaf)) {
              throw "ARTIFACT ASSERT FAILED: missing required file $p"
            }
            if ((Get-Item -LiteralPath $p).Length -le 0) {
              throw "ARTIFACT ASSERT FAILED: empty required file $p"
            }
          }
          $logDir = Join-Path $runDir.FullName 'logs'
          $logs = @(Get-ChildItem -LiteralPath $logDir -File -ErrorAction SilentlyContinue)
          if ($logs.Count -eq 0) {
            throw "ARTIFACT ASSERT FAILED: no per-case logs under $logDir"
          }
          $s = Get-Content -LiteralPath (Join-Path $runDir.FullName 'summary.json') -Raw | ConvertFrom-Json
          if ([string]$s.run_id -ne [string]$runDir.Name) {
            throw "ARTIFACT ASSERT FAILED: summary.run_id '$($s.run_id)' != run dir '$($runDir.Name)'"
          }
          $caseCount = @($s.cases).Count
          if ($caseCount -le 0) {
            throw 'ARTIFACT ASSERT FAILED: summary.json contains no cases'
          }
          Write-Host "ARTIFACT ASSERT OK run_dir=$($runDir.Name) cases=$caseCount logs=$($logs.Count)"

      - name: Job summary — full matrix (baseline-aware)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = @(
            '## Full regression matrix (baseline-aware, NOT a claim that all tests pass)',
            '',
            'All matrix cases were executed. Known pre-existing failures below are still FAIL records — they are not skipped, renamed or silenced.',
            'STRICT fail-closed: this check turns red if any declared baseline entry is NOT RUN / blocked / filtered out / missing / count-mismatched, or on NEW failures, drift, timeouts or unexpected NOT RUN.',
            'The baseline gate self-test step must also be green (proves blocked and filtered-out baseline entries fail).',
            ''
          )
          $runDir = Get-ChildItem -Path '.test-results' -Directory -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $runDir) {
            $lines += '**No `.test-results` output directory was produced by the runner.**'
          } else {
            $summaryPath = Join-Path $runDir.FullName 'summary.json'
            $lines += "Run directory: ``$($runDir.Name)``"
            if (Test-Path -LiteralPath $summaryPath) {
              $s = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json
              $lines += ''
              $lines += '| total | pass | FAIL | known-baseline | NEW | drift | unverified | unselected | baseline complete | timeout | not run | exit code |'
              $lines += '| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |'
              $lines += "| $($s.totals.total) | $($s.totals.pass) | $($s.totals.fail) | $($s.totals.known_fail) | $($s.totals.new_fail) | $($s.totals.baseline_drift) | $($s.totals.baseline_unverified) | $($s.totals.baseline_unselected) | $($s.totals.baseline_complete) | $($s.totals.timeout) | $($s.totals.not_run) | $($s.exit_code) |"
              $lines += ''
              $known = @()
              $new = @()
              foreach ($c in @($s.cases)) {
                if ($c.status -eq 'PASS') { continue }
                $isKnown = $false
                $baselineNote = ''
                if ($null -ne $c.baseline) {
                  $isKnown = [bool]$c.baseline.known
                  $baselineNote = [string]$c.baseline.reason
                }
                $row = "| ``$($c.id)`` | $($c.status) | exit=$($c.exit_code) | pass/fail=$($c.pass_count)/$($c.fail_count) | known_baseline=$isKnown | $baselineNote |"
                if ($isKnown) { $known += $row } else { $new += $row }
              }
              $lines += "### Known pre-existing failures (visible, NOT silently ignored): $($known.Count)"
              $lines += ''
              if ($known.Count -eq 0) {
                $lines += '_None reported — check the baseline file or the runner output._'
              } else {
                $lines += '| case | status | exit | pass/fail | known_baseline | reason |'
                $lines += '| --- | --- | --- | --- | --- | --- |'
                $lines += $known
              }
              $lines += ''
              $lines += "### NEW failures / regressions: $($new.Count)"
              $lines += ''
              if ($new.Count -eq 0) {
                $lines += '_None detected: no new failures, no baseline drift._'
              } else {
                $lines += '| case | status | exit | pass/fail | known_baseline | reason |'
                $lines += '| --- | --- | --- | --- | --- | --- |'
                $lines += $new
              }
            } else {
              $lines += '**summary.json missing — investigate the runner output.**'
            }
          }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload full matrix test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-matrix-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
